<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hackathon Consent Chat</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="participant-shell">
      <section class="panel chat-panel">
          <div class="chat-log" id="chatLog"></div>

        <form class="composer" id="chatForm">
          <input id="message" maxlength="1000" placeholder="Type a message" autocomplete="off">
          <button id="sendMessage" type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/participant.js"></script>
  </body>
</html>
